server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Instructor-only browser bridge for the local lab.
        # It reproduces the trusted-source condition already discovered in V16.
        proxy_set_header X-Forwarded-For 10.40.20.25;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cookie_path / /;
        proxy_redirect off;
    }
}
