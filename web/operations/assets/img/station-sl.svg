<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9d9d9"/><stop offset="1" stop-color="#bfc3c6"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d959a"/><stop offset=".45" stop-color="#eef1f2"/><stop offset="1" stop-color="#6f777c"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38cfff"/><stop offset="1" stop-color="#087dc3"/></linearGradient>
  <linearGradient id="pump" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d0909"/><stop offset=".5" stop-color="#ff3a28"/><stop offset="1" stop-color="#7d0505"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".35"/></filter>
  <style>
    .t{font-family:Arial,Segoe UI,sans-serif;fill:#111}.h{font-size:18px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.tag{fill:#fff;stroke:#5f6468;stroke-width:1}.panel{fill:#ececec;stroke:#7d8388;stroke-width:2}.green{fill:#20d82b;stroke:#13751b}.red{fill:#ed2024;stroke:#8d1114}.bluepipe{fill:none;stroke:#0878e8;stroke-width:13;stroke-linejoin:round}.redpipe{fill:none;stroke:#e71d23;stroke-width:13;stroke-linejoin:round}.greenpipe{fill:none;stroke:#22c33f;stroke-width:12;stroke-linejoin:round}.purplepipe{fill:none;stroke:#b123e8;stroke-width:12;stroke-linejoin:round}.arrow{fill:#fff}.thin{stroke:#40484d;stroke-width:2;fill:none}.valve{fill:#e82525;stroke:#6b0808;stroke-width:2}
  </style>
</defs>
<rect width="1440" height="900" fill="url(#panel)"/>
<rect x="0" y="0" width="1440" height="62" fill="#10449b"/><rect x="0" y="62" width="1440" height="46" fill="#cacaca" stroke="#808080"/>
